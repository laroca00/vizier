[package]
name = "vizier"
version = "0.1.0"
description = "League of Legends companion app"
authors = ["Tuğberk Akkurt"]
edition = "2024"

[lib]
# Distinct lib name avoids a bin/lib filename clash on Windows (cargo#8519).
name = "vizier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
