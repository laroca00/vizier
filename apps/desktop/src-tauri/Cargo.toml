[package]
name = "vizier"
version = "0.3.0"
description = "League of Legends companion app"
authors = ["Tuğberk Akkurt"]
edition = "2024"

[lib]
# Distinct lib name avoids a bin/lib filename clash on Windows (cargo#8519).
name = "vizier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "net", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
base64 = "0.23.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
